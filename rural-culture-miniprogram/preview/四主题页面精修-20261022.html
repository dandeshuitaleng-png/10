<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A方案 · 四主题页面精修</title><style>
*{box-sizing:border-box}body{margin:0;background:#F6F7F5;color:#29332D;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1220px;margin:auto;padding:32px 24px}h1{font-size:28px;line-height:1.4;margin:0 0 10px}p{margin:0 0 16px;color:#546158}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}nav button{min-height:44px;padding:8px 22px;border:1px solid #D6DED7;background:white;border-radius:10px;font:inherit;cursor:pointer}nav button[aria-pressed=true]{background:#293F34;border-color:#293F34;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.theme{min-width:0;padding:14px;border:1px solid #E1E5DF;border-top:4px solid var(--accent);border-radius:14px;background:white}h2{font-size:19px;margin:0 0 4px;color:var(--ink)}.category{font-size:12px;color:#667369;margin-bottom:12px}.theme img{display:block;width:100%;height:auto;background:var(--paper);border-radius:10px}.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.links a{display:inline-flex;align-items:center;min-height:44px;padding:5px 10px;border-radius:8px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:13px}.note{font-size:13px;margin-top:24px}a:focus-visible,button:focus-visible{outline:3px solid #2469AD;outline-offset:3px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><main><h1>A方案 · 四主题页面精修</h1><p>保留已确认的插画路线、主题横幅与春夏秋冬智小谷。首页卡片与对应底座水平对齐，锁标记收进底座，相邻关卡为人物留出空间，不添加连接线。此页也可对照配套页面的主题色、卡片层次和按钮细节。解析截图展示向下滚动后的说明区；答题截图可查看题干与选项。</p><nav aria-label="截图页面"><button aria-pressed="true" data-scene="home">首页 · 关卡对齐</button><button aria-pressed="false" data-scene="quiz">答题</button><button aria-pressed="false" data-scene="correct">解析 · 滚动后</button><button aria-pressed="false" data-scene="profile">我的学习</button></nav><section class="grid" id="themes"></section><p class="note">截图来自微信开发者工具实际渲染。本轮首页：四主题、三档宽度共 72 组浏览器检查和 48 组微信模拟器容器检查，另有四主题原生首页截图。内页精修的 120 组浏览器及 32 组模拟器记录单独保留；实体 iPhone、安卓微信仍需复核。正式小程序各自独立进入主题，本页仅供评审。</p></main><script>
const themes=[['red','十步芳草','红色记忆','#CF3E16','#57251F','#FFF3F0'],['culture','千年文脉','湖湘文化','#9E561D','#59371E','#FFF6E7'],['industry','金色产业','乡村产业','#F3CB26','#674310','#FFFBE5'],['ecology','青山绿水','自然生态','#34841C','#254C16','#F1FFF1']];
const base='v4.html?revision=20261022-card-aligned#/pages/game/index?review=1&controls=0';
document.querySelector('#themes').innerHTML=themes.map(([id,name,category,accent,ink,paper])=>`<article class="theme" style="--accent:${accent};--ink:${ink};--paper:${paper}"><h2>${name}</h2><div class="category">${category}</div><a class="capture" href="theme-details-20261022/${id}-home.png" target="_blank" rel="noopener"><img src="theme-details-20261022/${id}-home.png" alt="${name}首页关卡对齐实际截图"></a><div class="links"><a href="${base}&theme=${id}&scenario=home" target="_blank" rel="noopener">查看首页</a><a href="${base}&theme=${id}&scenario=quiz" target="_blank" rel="noopener">体验答题</a><a href="${base}&theme=${id}&scenario=home&route=profile" target="_blank" rel="noopener">我的学习</a></div></article>`).join('');
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));document.querySelectorAll('.theme').forEach((card,i)=>{const file='theme-details-20261022/'+themes[i][0]+'-'+b.dataset.scene+'.png';card.querySelector('img').src=file;card.querySelector('img').alt=themes[i][1]+b.textContent+'实际截图';card.querySelector('.capture').href=file;});});
</script></body></html>
