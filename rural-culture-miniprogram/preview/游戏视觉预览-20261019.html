<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味闯关 · 参考风格修订</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;color:#293b32;background:#edf0ec;font:14px/1.7 -apple-system,"PingFang SC",sans-serif}header{padding:24px 28px 18px;background:#fffdf9;border-bottom:1px solid #d9ded6}h1{font:800 25px/1.5 "Songti SC",serif;margin:0 0 5px}p{margin:0;color:#657169}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}select,a{font:inherit}select{height:42px;border:1px solid #cdd5c9;border-radius:10px;background:#fff;padding:0 12px;color:#324735;cursor:pointer}select:focus-visible{outline:3px solid #b98a34;outline-offset:2px}main{padding:24px 20px;display:flex;justify-content:center;overflow:auto}.screen{flex-shrink:0;width:377px;height:814px;border:1px solid #cbd4c6;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #2b423211;background:white}iframe{width:100%;height:100%;border:0;background:white}footer{padding:0 28px 24px;color:#6a776c;font-size:12px}a{color:#345b43}@media(max-width:450px){main{justify-content:flex-start;padding:16px 12px}header{padding:18px}}
</style></head><body><header><h1>趣味闯关 · 参考风格修订</h1><p>按提供的参考统一明亮配色、圆润卡通插画、底座与按钮。保留原始智小谷、三个原标题和既有规则。</p><nav>
<label>主题 <select id="theme"><option value="red">十步芳草</option><option value="culture">千年文脉</option><option value="industry">金色产业</option><option value="ecology" selected>青山绿水</option></select></label>
<label>尺寸 <select id="size"><option value="375,812">375 × 812</option><option value="320,568">320 × 568</option><option value="430,932">430 × 932</option></select></label>
<label>页面 <select id="route"><option value="home">首页地图</option><option value="profile">我的学习</option><option value="ranking">排行榜</option><option value="points">积分</option><option value="certificate">证书</option></select></label>
<label>数据 <select id="source"><option value="design">视觉样例</option><option value="live">本机联网记录</option></select></label>
<label>状态 <select id="scenario"><option value="home">未开始</option><option value="journey">已完成与可继续</option><option value="locked">今日锁定</option><option value="quiz">答题</option><option value="correct">答对解析</option><option value="revive">答错复活</option><option value="result">结果</option><option value="certificate">已获得证书</option><option value="ranking-empty">空榜单</option><option value="empty">空目录</option><option value="failure">断网占位</option></select></label>
</nav></header><main><div class="screen"><iframe id="game-preview" title="游戏实际页面"></iframe></div></main><footer><a href="/preview/角色动作预览-20261019.html">查看角色动作</a> · 视觉样例不写入真实学习记录；切换到本机联网记录后，答题会保存进度。人物互动会联动底座和关卡卡片；点击关卡卡片或底部按钮进入学习。可在“我的学习”中开启减少动态效果。</footer><script>
const integrated='http://127.0.0.1:6497',fixtures='http://127.0.0.1:6501';
function update(){const theme=document.querySelector('#theme').value,route=document.querySelector('#route').value,design=document.querySelector('#source').value==='design',scenario=document.querySelector('#scenario').value;document.getElementById('game-preview').src=(design?fixtures:integrated)+'/preview/v4.html?view='+[theme,route,scenario].join('-')+'#/pages/game/index?theme='+theme+'&route='+route+(design?'&review=1&controls=0&scenario='+scenario:'');}
for(const field of ['theme','route','source','scenario'])document.getElementById(field).addEventListener('change',update);
document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const screen=document.querySelector('.screen');screen.style.width=(Number(w)+2)+'px';screen.style.height=(Number(h)+2)+'px';});
update();
</script></body></html>
