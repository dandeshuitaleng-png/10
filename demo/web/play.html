<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b80"><title>趣味闯关 · 乡村知识之旅</title>
  <link rel="stylesheet" href="/web/play.css">
</head>
<body>
  <main>
    <aside class="journey-copy">
      <a class="wordmark" href="/web/play.html">乡村知识之旅</a>
      <h1>沿着小路，<br>发现家乡。</h1>
      <p class="intro">听红色故事，读千年文脉，认识乡土物产，走近青山绿水。</p>
      <div class="journey-rule"><span id="theme-count">正在连接</span><span id="level-count">旅程加载中</span><span id="question-rule">按关卡配置答题</span></div>
      <p class="hint">完成本关题目，点亮下一站。完成主题，收藏专属证书。</p>
      <div class="environment" id="environment">正在连接游戏…</div>
      <a class="admin-link" href="/web/admin.html">内容管理 ↗</a>
    </aside>
    <section class="stage" aria-label="趣味闯关游戏">
      <canvas id="game"></canvas>
      <p class="sr-only" id="game-status" role="status" aria-live="polite"></p>
      <div id="controls" class="semantic-controls" aria-label="游戏操作"></div>
      <div id="connection-notice" hidden><span></span><button type="button">重试连接</button></div>
    </section>
  </main>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <button type="button" class="dialog-close" data-close aria-label="关闭">×</button>
    <p class="eyebrow">分享这段旅程</p><h2 id="share-title">邀请朋友一起闯关</h2>
    <p>分享乡村知识之旅，让更多人发现家乡。</p>
    <button type="button" id="share-invite" class="primary">分享邀请</button>
    <div id="revive-test"><p class="test-note">当前为体验版。实际分享完成尚不能验证，下方用于测试复活。</p><button type="button" id="test-revive" class="secondary">体验复活</button></div>
    <p id="share-status" role="status"></p>
  </dialog>
  <dialog id="certificate-dialog" aria-labelledby="certificate-share-title">
    <button type="button" class="dialog-close" data-close aria-label="关闭证书">×</button>
    <p class="eyebrow">收藏这段旅程</p><h2 id="certificate-share-title">分享我的证书</h2>
    <img id="certificate-preview" alt="当前账号已获得的电子证书">
    <p id="certificate-status" role="status">证书图片已生成，可以分享或保存。</p>
    <button type="button" id="certificate-send" class="primary">分享证书图片</button>
    <button type="button" id="certificate-save" class="secondary">保存证书图片</button>
  </dialog>
  <dialog id="video-dialog" aria-label="题目视频">
    <button type="button" class="dialog-close" data-close aria-label="关闭视频">×</button>
    <h2>题目视频</h2><p>播放期间答题计时继续。</p><video controls playsinline preload="metadata"></video>
    <p class="video-error" hidden>视频加载失败，请关闭后重试。</p>
  </dialog>
  <script src="/design/runtime-bundle.js"></script><script src="/web/play.js"></script>
</body>
</html>
