name: Code quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            quiz-admin/package-lock.json
            rural-culture-miniprogram/tools/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix quiz-admin
      - run: npm ci --ignore-scripts --prefix rural-culture-miniprogram/tools
      - run: npm run build --prefix quiz-admin
      - run: |
          mkdir -p .rural-quiz-runtime/quality
          npm run check 2>&1 | tee .rural-quiz-runtime/quality/check.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: demo/design/full-development/evidence/operations-report.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: .rural-quiz-runtime/quality/
          retention-days: 14
